name: Auto-merge generated PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: ["World Problems Nightly"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: automerge-generated-prs-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: true

jobs:
  automerge:
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate and merge eligible PRs
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const eventName = context.eventName;

            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const BOT_AUTHORS = new Set(['github-actions[bot]', 'app/github-actions']);
            const BRANCH_PREFIX = 'automation/world-problems-';
            const TITLE_PREFIX = 'chore: add new world problems posts';

            function isEligibleByMetadata(pr) {
              const author = pr.user?.login || '';
              const headRef = pr.head?.ref || '';
              const baseRef = pr.base?.ref || '';
              const title = pr.title || '';

              if (pr.state !== 'open') {
                return { ok: false, reason: 'not open' };
              }

              if (pr.draft) {
                return { ok: false, reason: 'draft PR' };
              }

              if (baseRef !== 'main') {
                return { ok: false, reason: `base is ${baseRef}` };
              }

              if (!BOT_AUTHORS.has(author)) {
                return { ok: false, reason: `author is ${author}` };
              }

              if (!headRef.startsWith(BRANCH_PREFIX)) {
                return { ok: false, reason: `head is ${headRef}` };
              }

              if (!title.startsWith(TITLE_PREFIX)) {
                return { ok: false, reason: `title is \"${title}\"` };
              }

              return { ok: true, reason: 'metadata match' };
            }

            async function collectCandidatePRNumbers() {
              try {
                if (eventName === 'pull_request') {
                  return [context.payload.pull_request.number];
                }

                if (eventName === 'workflow_run') {
                  const prs = context.payload.workflow_run?.pull_requests || [];
                  return prs.map((pr) => pr.number).filter(Boolean);
                }

                if (eventName === 'workflow_dispatch') {
                  const { data } = await github.rest.pulls.list({
                    owner,
                    repo,
                    state: 'open',
                    per_page: 100,
                    sort: 'updated',
                    direction: 'desc'
                  });
                  return data.map((pr) => pr.number);
                }
              } catch (error) {
                core.warning(`Failed to collect candidate PRs: ${error.message}`);
              }

              return [];
            }

            async function getRequiredContexts(baseRef) {
              try {
                const protection = await github.rest.repos.getBranchProtection({
                  owner,
                  repo,
                  branch: baseRef
                });
                return protection.data.required_status_checks?.contexts || [];
              } catch (error) {
                core.warning(`Could not load branch protection for ${baseRef}: ${error.message}`);
                return [];
              }
            }

            async function isChecksPassing(headSha, requiredContexts) {
              try {
                const [combined, checks] = await Promise.all([
                  github.rest.repos.getCombinedStatusForRef({
                    owner,
                    repo,
                    ref: headSha
                  }),
                  github.rest.checks.listForRef({
                    owner,
                    repo,
                    ref: headSha,
                    per_page: 100
                  })
                ]);

                const statuses = combined.data.statuses || [];
                const checkRuns = checks.data.check_runs || [];

                if (requiredContexts.length > 0) {
                  const failingContexts = [];

                  for (const contextName of requiredContexts) {
                    const latest = statuses.find((s) => s.context === contextName);
                    if (!latest || latest.state !== 'success') {
                      failingContexts.push({
                        context: contextName,
                        state: latest?.state || 'missing'
                      });
                    }
                  }

                  if (failingContexts.length > 0) {
                    for (const context of failingContexts) {
                      core.info(
                        `Required context blocking merge: ${context.context} (state=${context.state})`
                      );
                    }
                    return {
                      ok: false,
                      reason: `Required contexts not successful: ${failingContexts
                        .map((context) => `${context.context}=${context.state}`)
                        .join(', ')}`
                    };
                  }

                  const nonSuccessRuns = checkRuns.filter(
                    (run) => run.status !== 'completed' || run.conclusion !== 'success'
                  );
                  if (nonSuccessRuns.length > 0) {
                    for (const run of nonSuccessRuns) {
                      core.info(
                        `Non-success check run (ignored because required contexts are configured): ${run.name} (status=${run.status}, conclusion=${run.conclusion || 'null'})`
                      );
                    }
                  }

                  return { ok: true, reason: 'All required contexts passed' };
                }

                const blockingRuns = [];
                const waitingRuns = [];

                for (const run of checkRuns) {
                  const conclusion = run.conclusion || 'null';
                  if (run.status !== 'completed') {
                    waitingRuns.push({ name: run.name, status: run.status, conclusion });
                    continue;
                  }

                  if (['failure', 'error', 'cancelled'].includes(conclusion)) {
                    blockingRuns.push({ name: run.name, status: run.status, conclusion });
                    continue;
                  }

                  if (!['success', 'neutral', 'skipped'].includes(conclusion)) {
                    blockingRuns.push({ name: run.name, status: run.status, conclusion });
                  }
                }

                if (blockingRuns.length > 0) {
                  for (const run of blockingRuns) {
                    core.info(
                      `Check run blocking merge: ${run.name} (status=${run.status}, conclusion=${run.conclusion})`
                    );
                  }
                  return {
                    ok: false,
                    reason: `Blocking check runs: ${blockingRuns
                      .map((run) => `${run.name}=${run.status}/${run.conclusion}`)
                      .join(', ')}`
                  };
                }

                if (waitingRuns.length > 0) {
                  for (const run of waitingRuns) {
                    core.info(
                      `Check run still in progress: ${run.name} (status=${run.status}, conclusion=${run.conclusion})`
                    );
                  }
                  return {
                    ok: false,
                    reason: `Check runs still in progress: ${waitingRuns
                      .map((run) => `${run.name}=${run.status}/${run.conclusion}`)
                      .join(', ')}`
                  };
                }

                if (checkRuns.length === 0 && combined.data.state !== 'success') {
                  return { ok: false, reason: `Combined status is ${combined.data.state}` };
                }

                return { ok: true, reason: 'All checks passed' };
              } catch (error) {
                core.warning(`Failed to evaluate checks for ${headSha}: ${error.message}`);
                return { ok: false, reason: 'API error while checking statuses' };
              }
            }

            async function deleteHeadBranch(headRef) {
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${headRef}`
                });
                core.info(`Deleted branch ${headRef}`);
              } catch (error) {
                core.warning(`Branch delete skipped for ${headRef}: ${error.message}`);
              }
            }

            const candidates = [...new Set(await collectCandidatePRNumbers())];
            if (candidates.length === 0) {
              core.info('No candidate PRs to evaluate.');
              return;
            }

            core.info(`Evaluating candidate PRs: ${candidates.join(', ')}`);

            for (const number of candidates) {
              try {
                const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
                const meta = isEligibleByMetadata(pr);
                if (!meta.ok) {
                  core.info(`PR #${number} is not eligible: ${meta.reason}. Skipping.`);
                  continue;
                }

                const requiredContexts = await getRequiredContexts(pr.base.ref);
                let merged = false;

                for (let attempt = 1; attempt <= 8; attempt++) {
                  const { data: current } = await github.rest.pulls.get({ owner, repo, pull_number: number });
                  const currentMeta = isEligibleByMetadata(current);
                  if (!currentMeta.ok) {
                    core.info(`PR #${number} became ineligible: ${currentMeta.reason}.`);
                    break;
                  }

                  if (current.mergeable === null) {
                    core.info(`PR #${number} mergeable is null (attempt ${attempt}/8). Retrying in 15s...`);
                    await sleep(15000);
                    continue;
                  }

                  if (!current.mergeable || current.mergeable_state === 'dirty') {
                    core.info(`PR #${number} is not mergeable yet (mergeable=${current.mergeable}, state=${current.mergeable_state}).`);
                    break;
                  }

                  const checks = await isChecksPassing(current.head.sha, requiredContexts);
                  if (!checks.ok) {
                    core.info(`PR #${number} checks not ready: ${checks.reason}`);
                    await sleep(15000);
                    continue;
                  }

                  try {
                    await github.rest.pulls.merge({
                      owner,
                      repo,
                      pull_number: number,
                      merge_method: 'squash'
                    });
                    core.info(`Merged PR #${number} with squash.`);
                    await deleteHeadBranch(current.head.ref);
                    merged = true;
                  } catch (error) {
                    core.warning(`Merge attempt failed for PR #${number}: ${error.message}`);
                  }

                  break;
                }

                if (!merged) {
                  core.info(`PR #${number} was not merged in this run (safe exit, no retry loop).`);
                }
              } catch (error) {
                core.warning(`Failed to process PR #${number}: ${error.message}`);
              }
            }
