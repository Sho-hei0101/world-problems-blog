name: Auto-merge generated PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  check_suite:
    types: [completed]
  workflow_run:
    workflows: ["World Problems Nightly"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: automerge-generated-prs-${{ github.event.pull_request.number || github.event.check_suite.head_sha || github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: true

jobs:
  automerge:
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate and merge eligible PRs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const eventName = context.eventName;

            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            async function collectCandidatePRNumbers() {
              if (eventName === 'pull_request') {
                return [context.payload.pull_request.number];
              }

              if (eventName === 'check_suite') {
                const prs = context.payload.check_suite?.pull_requests || [];
                return prs.map((pr) => pr.number).filter(Boolean);
              }

              if (eventName === 'workflow_run') {
                const prs = context.payload.workflow_run?.pull_requests || [];
                return prs.map((pr) => pr.number).filter(Boolean);
              }

              if (eventName === 'workflow_dispatch') {
                const { data } = await github.rest.pulls.list({
                  owner,
                  repo,
                  state: 'open',
                  per_page: 100,
                  sort: 'updated',
                  direction: 'desc'
                });
                return data.map((pr) => pr.number);
              }

              return [];
            }

            async function getRequiredContexts(baseRef) {
              try {
                const protection = await github.rest.repos.getBranchProtection({
                  owner,
                  repo,
                  branch: baseRef
                });
                return protection.data.required_status_checks?.contexts || [];
              } catch (error) {
                core.warning(`Could not load branch protection for ${baseRef}: ${error.message}`);
                return [];
              }
            }

            async function isChecksPassing(headSha, requiredContexts) {
              const combined = await github.rest.repos.getCombinedStatusForRef({
                owner,
                repo,
                ref: headSha
              });

              if (combined.data.state === 'failure' || combined.data.state === 'error') {
                return { ok: false, reason: `Combined status is ${combined.data.state}` };
              }

              const checks = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: headSha,
                per_page: 100
              });

              const checkRuns = checks.data.check_runs || [];
              const badRun = checkRuns.find((run) => run.status !== 'completed' || run.conclusion !== 'success');
              if (badRun) {
                return {
                  ok: false,
                  reason: `Check run not successful: ${badRun.name} (${badRun.status}/${badRun.conclusion})`
                };
              }

              if (requiredContexts.length > 0) {
                const statuses = combined.data.statuses || [];
                const missing = requiredContexts.filter((contextName) => {
                  const latest = statuses.find((s) => s.context === contextName);
                  return !latest || latest.state !== 'success';
                });

                if (missing.length > 0) {
                  return { ok: false, reason: `Required contexts not successful: ${missing.join(', ')}` };
                }
              } else if (combined.data.state !== 'success') {
                return { ok: false, reason: `Combined status is ${combined.data.state}` };
              }

              return { ok: true, reason: 'All checks passed' };
            }

            async function deleteHeadBranch(headRef) {
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${headRef}`
                });
                core.info(`Deleted branch ${headRef}`);
              } catch (error) {
                core.warning(`Branch delete skipped for ${headRef}: ${error.message}`);
              }
            }

            const candidates = [...new Set(await collectCandidatePRNumbers())];
            if (candidates.length === 0) {
              core.info('No candidate PRs to evaluate.');
              return;
            }

            core.info(`Evaluating candidate PRs: ${candidates.join(', ')}`);

            for (const number of candidates) {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });

              if (pr.state !== 'open') {
                core.info(`PR #${number} is not open. Skipping.`);
                continue;
              }

              if (pr.draft) {
                core.info(`PR #${number} is draft. Skipping.`);
                continue;
              }

              const author = pr.user?.login || '';
              const headRef = pr.head?.ref || '';
              const baseRef = pr.base?.ref || '';
              const byActionsBot = author === 'github-actions[bot]';
              const byAutomationBranch = headRef.startsWith('automation/world-problems-');

              if (!byActionsBot && !byAutomationBranch) {
                core.info(`PR #${number} is not an automation PR (author=${author}, head=${headRef}). Skipping.`);
                continue;
              }

              if (baseRef !== 'main') {
                core.info(`PR #${number} targets ${baseRef}, not main. Skipping.`);
                continue;
              }

              const requiredContexts = await getRequiredContexts(baseRef);
              let merged = false;

              for (let attempt = 1; attempt <= 8; attempt++) {
                const { data: current } = await github.rest.pulls.get({ owner, repo, pull_number: number });

                if (current.state !== 'open') {
                  core.info(`PR #${number} is no longer open.`);
                  merged = current.merged;
                  break;
                }

                if (current.mergeable === null) {
                  core.info(`PR #${number} mergeable is null (attempt ${attempt}/8). Retrying in 15s...`);
                  await sleep(15000);
                  continue;
                }

                if (!current.mergeable || current.mergeable_state === 'dirty') {
                  core.info(`PR #${number} is not mergeable yet (mergeable=${current.mergeable}, state=${current.mergeable_state}).`);
                  break;
                }

                const checks = await isChecksPassing(current.head.sha, requiredContexts);
                if (!checks.ok) {
                  core.info(`PR #${number} checks not ready: ${checks.reason}`);
                  await sleep(15000);
                  continue;
                }

                try {
                  await github.rest.pulls.merge({
                    owner,
                    repo,
                    pull_number: number,
                    merge_method: 'squash'
                  });

                  core.info(`Merged PR #${number} with squash.`);
                  await deleteHeadBranch(current.head.ref);
                  merged = true;
                } catch (error) {
                  core.warning(`Merge attempt failed for PR #${number}: ${error.message}`);
                }

                break;
              }

              if (!merged) {
                core.info(`PR #${number} was not merged in this run (safe exit, no retry loop).`);
              }
            }
