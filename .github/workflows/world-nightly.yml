name: World Problems Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: world-problems-nightly
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run world generator
        run: npm run world:run
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Show generated posts
        run: |
          echo "Generated posts directory snapshot:"
          ls -R content/posts | head -n 200
      - name: Verify post output
        run: |
          if [[ -z "$(git status --porcelain content/posts)" ]]; then
            echo "No new posts generated. See generator logs above."
            exit 1
          fi
          if [[ -z "$(find content/posts -type f -name '*.md' -print -quit)" ]]; then
            echo "No markdown files found under content/posts."
            exit 1
          fi
      - name: Create PR
        id: create_pr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: add world problems posts"
          title: "chore: add new world problems posts"
          body: |
            ## Summary
            - Generated new world problems posts from Reddit sources.

            ## Configuration
            - Requires OPENAI_API_KEY in repo Settings → Secrets and variables → Actions.

            ## Verification
            - npm ci
            - npm run world:run
          branch: automation/world-problems-${{ github.run_id }}
          delete-branch: true
          add-paths: |
            content/posts/**
            content/*/posts/**
      - name: No changes detected
        if: steps.create_pr.outputs.pull-request-number == ''
        run: echo "::notice::No PR created (no changes detected)."
      - name: PR created
        if: steps.create_pr.outputs.pull-request-number != ''
        run: |
          echo "PR created successfully: #${{ steps.create_pr.outputs.pull-request-number }}"
          echo "URL: ${{ steps.create_pr.outputs.pull-request-url }}"
