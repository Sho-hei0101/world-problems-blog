name: World Problems Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: world-problems-nightly
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run world generator
        run: npm run world:run
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Create PR
        id: create_pr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: add world problems posts"
          title: "chore: add new world problems posts"
          body: |
            ## Summary
            - Generated new world problems posts from Reddit sources.

            ## Configuration
            - Requires OPENAI_API_KEY in repo Settings → Secrets and variables → Actions.

            ## Verification
            - npm ci
            - npm run world:run
          branch: automation/world-problems-${{ github.run_id }}
          delete-branch: true
          add-paths: |
            content/posts/**
      - name: No changes detected
        if: steps.create_pr.outputs.pull-request-number == ''
        run: echo "No PR created (no changes detected)."
      - name: Enable auto-merge
        if: steps.create_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_number="${{ steps.create_pr.outputs.pull-request-number }}"
          pr_url="${{ steps.create_pr.outputs.pull-request-url }}"
          echo "PR URL (from create-pull-request): ${pr_url}"

          pr_json="$(gh pr view "${pr_number}" --json author,headRefName,baseRefName,url)"
          author="$(echo "${pr_json}" | jq -r '.author.login')"
          head_ref="$(echo "${pr_json}" | jq -r '.headRefName')"
          base_ref="$(echo "${pr_json}" | jq -r '.baseRefName')"
          resolved_url="$(echo "${pr_json}" | jq -r '.url')"

          echo "Resolved PR URL: ${resolved_url}"
          echo "Author: ${author}"
          echo "Head ref: ${head_ref}"
          echo "Base ref: ${base_ref}"

          if [[ "${base_ref}" != "main" ]]; then
            echo "Refusing to auto-merge: base branch is not main."
            exit 1
          fi

          if [[ "${head_ref}" != automation/world-problems-* ]]; then
            echo "Refusing to auto-merge: head ref does not match automation/world-problems-*."
            exit 1
          fi

          if [[ "${author}" != "github-actions[bot]" && "${author}" != "${{ github.actor }}" ]]; then
            echo "Refusing to auto-merge: PR author is not github-actions[bot] or workflow actor."
            exit 1
          fi

          gh pr merge "${pr_number}" --squash --auto --delete-branch
          gh pr view "${pr_number}" --json mergeStateStatus,autoMergeRequest,mergedAt,url --jq \
            '"Auto-merge status: \(.mergeStateStatus) | Auto-merge enabled: \(.autoMergeRequest != null) | Merged at: \(.mergedAt) | URL: \(.url)"'
