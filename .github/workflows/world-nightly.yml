name: World Problems Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: world-problems-nightly
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run world generator
        run: npm run world:run
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Create PR
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: add world problems posts"
          title: "chore: add new world problems posts"
          body: |
            ## Summary
            - Generated new world problems posts from Reddit sources.

            ## Configuration
            - Requires OPENAI_API_KEY in repo Settings → Secrets and variables → Actions.

            ## Verification
            - npm ci
            - npm run world:run
          branch: automation/world-problems-${{ github.run_id }}
          delete-branch: true
          add-paths: |
            content/posts/**
